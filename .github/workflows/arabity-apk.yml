name: Build Arabity APK

on:
  workflow_dispatch:
  push:
    paths:
      - "arabity/**"
      - ".github/workflows/arabity-apk.yml"
      - "public/car/**"
      - "package.json"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build sideload APK
        run: bash arabity/scripts/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arabity.apk
          path: public/car/arabity.apk
          if-no-files-found: error
