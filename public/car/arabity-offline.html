:root {
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;

  --radius-s: 8px;
  --radius-m: 12px;
  --radius-l: 16px;
  --radius-xl: 24px;
  --radius-pill: 999px;

  --font: system-ui, -apple-system, "Segoe UI", "Tahoma", "Arial", "Noto Sans Arabic", sans-serif;
  --font-num: ui-rounded, "Segoe UI", system-ui, sans-serif;

  --fs-display: clamp(2rem, 5vw, 2.75rem);
  --fs-title: 1.5rem;
  --fs-section: 1.125rem;
  --fs-card: 1.05rem;
  --fs-body: 1rem;
  --fs-caption: 0.875rem;
  --fs-label: 0.8125rem;
  --lh-body: 1.65;

  --navy-950: #06182c;
  --navy-900: #0a2540;
  --navy-800: #123056;
  --navy-700: #1a3d68;
  --teal-600: #0d9b8a;
  --teal-500: #12b3a0;
  --teal-400: #1ec8b8;
  --teal-100: #d8f6f2;
  --success-600: #0f9f6e;
  --success-100: #d9f5ea;
  --warning-600: #d97706;
  --warning-100: #feefd6;
  --danger-600: #dc3d3d;
  --danger-100: #fde8e8;
  --info-600: #2563eb;
  --info-100: #dbe7fe;

  --ease: 180ms cubic-bezier(0.22, 1, 0.36, 1);
  --ease-out: 220ms cubic-bezier(0.16, 1, 0.3, 1);
  --shadow-sm: 0 1px 2px rgba(10, 37, 64, 0.06);
  --shadow-md: 0 8px 24px rgba(10, 37, 64, 0.08);
  --shadow-lg: 0 18px 50px rgba(10, 37, 64, 0.14);
  --touch: 44px;
  --sidebar-w: 280px;
  --content-max: 920px;
  --nav-h: 72px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
}

:root,
[data-theme="light"] {
  color-scheme: light;
  --bg: #f3f5f8;
  --bg-elev: #eef1f6;
  --surface: #ffffff;
  --surface-2: #f7f8fb;
  --text: #0f172a;
  --text-muted: #5b677a;
  --text-faint: #8a95a8;
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.14);
  --primary: var(--navy-900);
  --primary-hover: var(--navy-800);
  --on-primary: #ffffff;
  --accent: var(--teal-600);
  --accent-soft: #e6f7f4;
  --hero-from: #0a2540;
  --hero-to: #135e62;
  --overlay: rgba(6, 24, 44, 0.46);
  --chart-1: #0a2540;
  --chart-2: #0d9b8a;
  --chart-3: #d97706;
  --chart-4: #2563eb;
  --chart-5: #7c3aed;
  --chart-6: #dc3d3d;
  --chart-grid: rgba(15, 23, 42, 0.08);
  --focus: #12b3a0;
  --bottom-nav-bg: rgba(255, 255, 255, 0.92);
  --sidebar-bg: #0a2540;
  --sidebar-text: #d7e3f2;
  --sidebar-active: #ffffff;
  --status-safe-bg: var(--success-100);
  --status-safe-fg: #086b4a;
  --status-warn-bg: var(--warning-100);
  --status-warn-fg: #9a4d04;
  --status-due-bg: #fde8d4;
  --status-due-fg: #9a3412;
  --status-danger-bg: var(--danger-100);
  --status-danger-fg: #9f1239;
}

[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b1220;
  --bg-elev: #10192a;
  --surface: #141c2c;
  --surface-2: #1b2538;
  --text: #e8eef7;
  --text-muted: #93a0b5;
  --text-faint: #6d7b91;
  --border: rgba(232, 238, 247, 0.08);
  --border-strong: rgba(232, 238, 247, 0.16);
  --primary: #d7e8ff;
  --primary-hover: #ffffff;
  --on-primary: #0a2540;
  --accent: var(--teal-400);
  --accent-soft: rgba(30, 200, 184, 0.12);
  --hero-from: #07101d;
  --hero-to: #0d3d48;
  --overlay: rgba(0, 0, 0, 0.62);
  --chart-1: #8ab4ff;
  --chart-2: #1ec8b8;
  --chart-3: #fbbf24;
  --chart-4: #60a5fa;
  --chart-5: #c4b5fd;
  --chart-6: #f87171;
  --chart-grid: rgba(232, 238, 247, 0.08);
  --focus: #1ec8b8;
  --bottom-nav-bg: rgba(20, 28, 44, 0.94);
  --sidebar-bg: #07101d;
  --sidebar-text: #b7c6db;
  --sidebar-active: #ffffff;
  --status-safe-bg: rgba(15, 159, 110, 0.16);
  --status-safe-fg: #5ee9b5;
  --status-warn-bg: rgba(217, 119, 6, 0.16);
  --status-warn-fg: #fbbf24;
  --status-due-bg: rgba(234, 88, 12, 0.16);
  --status-due-fg: #fdba74;
  --status-danger-bg: rgba(220, 61, 61, 0.16);
  --status-danger-fg: #fca5a5;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.28);
  --shadow-md: 0 10px 28px rgba(0, 0, 0, 0.32);
  --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.45);
}

@media (prefers-reduced-motion: reduce) {
  :root {
    --ease: 1ms linear;
    --ease-out: 1ms linear;
  }
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  min-height: 100%;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  color: var(--text);
  background: var(--bg);
  overflow-x: hidden;
}

img,
svg {
  max-width: 100%;
  display: block;
}

button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  background: none;
  border: 0;
}

a {
  color: inherit;
  text-decoration: none;
}

ul,
ol {
  margin: 0;
  padding: 0;
  list-style: none;
}

h1,
h2,
h3,
h4,
p {
  margin: 0;
}

table {
  border-collapse: collapse;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.skip-link {
  position: absolute;
  right: 12px;
  top: -40px;
  background: var(--primary);
  color: var(--on-primary);
  padding: 8px 12px;
  border-radius: var(--radius-s);
  z-index: 100;
}
.skip-link:focus {
  top: 12px;
}

[hidden] {
  display: none !important;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  border: 0;
}

.app {
  min-height: 100dvh;
  display: flex;
  background: var(--bg);
}

.sidebar {
  display: none;
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  color: var(--sidebar-text);
  padding: calc(24px + var(--safe-top)) 16px 24px;
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow-y: auto;
}

.app-body {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(16px);
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  padding: calc(10px + var(--safe-top)) 16px 10px;
}

.app-main {
  width: min(var(--content-max), 100%);
  margin: 0 auto;
  padding: 8px 16px 32px;
  flex: 1;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 30;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  background: var(--bottom-nav-bg);
  backdrop-filter: blur(18px);
  border-top: 1px solid var(--border);
  padding: 6px 6px calc(6px + var(--safe-bottom));
}

.page {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.page-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.page-head-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.brand-lockup {
  display: flex;
  align-items: center;
  gap: 12px;
  color: #fff;
  padding: 8px 8px 24px;
}

.brand-mark {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  background: linear-gradient(145deg, #1ec8b8, #0d9b8a);
  display: grid;
  place-items: center;
  box-shadow: 0 8px 20px rgba(13, 155, 138, 0.35);
}

.brand-name {
  font-weight: 800;
  font-size: 1.2rem;
  color: #fff;
}

.brand-tag {
  font-size: 0.75rem;
  opacity: 0.72;
}

.nav-section-label {
  font-size: 11px;
  letter-spacing: 0.08em;
  opacity: 0.5;
  padding: 16px 12px 6px;
}

.nav-link {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 44px;
  padding: 8px 12px;
  border-radius: 12px;
  color: var(--sidebar-text);
  text-align: right;
}

.nav-link.is-active,
.nav-link:hover {
  background: rgba(255, 255, 255, 0.08);
  color: var(--sidebar-active);
}

.nav-link svg {
  flex-shrink: 0;
  opacity: 0.9;
}

.bottom-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 56px;
  border-radius: 14px;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
}

.bottom-nav-btn svg {
  width: 22px;
  height: 22px;
}

.bottom-nav-btn.is-active {
  color: var(--accent);
  background: var(--accent-soft);
}

.bottom-nav-btn.is-cta {
  color: var(--on-primary);
}

.bottom-nav-btn.is-cta .cta-bubble {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  background: var(--navy-900);
  color: #fff;
  box-shadow: 0 8px 18px rgba(10, 37, 64, 0.28);
  margin-top: -18px;
}

[data-theme="dark"] .bottom-nav-btn.is-cta .cta-bubble {
  background: var(--teal-500);
  color: #06241f;
}

.app.is-onboarding .sidebar,
.app.is-onboarding .bottom-nav,
.app.is-onboarding .topbar {
  display: none;
}

.onboarding-shell .brand-name {
  color: var(--text);
}

.onboarding-shell .brand-lockup {
  color: inherit;
}

.app.is-onboarding .app-body {
  padding-bottom: 0;
}

.app.is-onboarding .app-main {
  width: min(560px, 100%);
  padding: 24px 16px calc(32px + var(--safe-bottom));
}

@media (min-width: 1024px) {
  .sidebar {
    display: block;
  }
  .bottom-nav {
    display: none;
  }
  .app-body {
    padding-bottom: 0;
  }
  .app-main {
    padding: 20px 32px 48px;
  }
  .topbar {
    padding: 16px 32px 8px;
  }
}

.card {
  background: var(--surface);
  border-radius: var(--radius-l);
  box-shadow: var(--shadow-sm);
  padding: 16px;
}

.card-soft {
  background: var(--surface-2);
  border-radius: var(--radius-l);
  padding: 16px;
}

.hero-card {
  background: linear-gradient(145deg, var(--hero-from), var(--hero-to));
  color: #fff;
  border-radius: var(--radius-xl);
  padding: 22px 20px 20px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}

.hero-card::after {
  content: "";
  position: absolute;
  inset-inline-end: -40px;
  top: -50px;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: rgba(30, 200, 184, 0.18);
}

.hero-label {
  font-size: var(--fs-caption);
  opacity: 0.82;
  margin-bottom: 8px;
}

.hero-value {
  font-family: var(--font-num);
  font-size: var(--fs-display);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}

.hero-delta {
  margin-top: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 10px;
  border-radius: var(--radius-pill);
  background: rgba(255, 255, 255, 0.12);
  font-size: 13px;
  font-weight: 700;
}

.hero-delta.up {
  background: rgba(252, 165, 165, 0.18);
}
.hero-delta.down {
  background: rgba(94, 233, 181, 0.16);
}

.kpi-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.kpi-card {
  background: var(--surface);
  border-radius: var(--radius-l);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  min-height: 92px;
}

.kpi-card .label {
  color: var(--text-muted);
  font-size: var(--fs-label);
  margin-bottom: 8px;
}

.kpi-card .value {
  font-weight: 800;
  font-size: 1.2rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.section-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-size: var(--fs-section);
  font-weight: 800;
}

.muted {
  color: var(--text-muted);
}

.faint {
  color: var(--text-faint);
  font-size: var(--fs-caption);
}

.stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.wrap {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.btn {
  min-height: var(--touch);
  padding: 10px 16px;
  border-radius: var(--radius-m);
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  cursor: pointer;
  transition: transform var(--ease), background var(--ease), opacity var(--ease);
}

.btn:active {
  transform: scale(0.98);
}

.btn-primary {
  background: var(--navy-900);
  color: #fff;
}

[data-theme="dark"] .btn-primary {
  background: var(--teal-500);
  color: #06241f;
}

.btn-accent {
  background: var(--accent);
  color: #06241f;
}

.btn-ghost {
  background: var(--surface-2);
  color: var(--text);
}

.btn-danger {
  background: var(--danger-600);
  color: #fff;
}

.btn-block {
  width: 100%;
}

.btn-sm {
  min-height: 36px;
  padding: 6px 12px;
  font-size: 13px;
  border-radius: var(--radius-s);
}

.chip {
  min-height: 36px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  background: var(--surface);
  color: var(--text-muted);
  font-weight: 700;
  font-size: 13px;
  box-shadow: var(--shadow-sm);
}

.chip.is-active {
  background: var(--navy-900);
  color: #fff;
}

[data-theme="dark"] .chip.is-active {
  background: var(--teal-500);
  color: #06241f;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 28px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  font-size: 12px;
  font-weight: 800;
}

.badge-safe {
  background: var(--status-safe-bg);
  color: var(--status-safe-fg);
}
.badge-warn {
  background: var(--status-warn-bg);
  color: var(--status-warn-fg);
}
.badge-due {
  background: var(--status-due-bg);
  color: var(--status-due-fg);
}
.badge-danger {
  background: var(--status-danger-bg);
  color: var(--status-danger-fg);
}
.badge-demo {
  background: var(--info-100);
  color: var(--info-600);
}

.list-card {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  border-radius: var(--radius-l);
  padding: 14px;
  box-shadow: var(--shadow-sm);
  text-align: right;
  width: 100%;
}

.list-card:hover {
  box-shadow: var(--shadow-md);
}

.list-title {
  font-weight: 800;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  display: inline-block;
}

.vehicle-switcher {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  border-radius: var(--radius-l);
  padding: 12px 14px;
  box-shadow: var(--shadow-sm);
  width: 100%;
  text-align: right;
  min-height: 72px;
}

.vehicle-name {
  font-weight: 800;
  font-size: 1.05rem;
}

.insight-card {
  background: var(--surface);
  border-radius: var(--radius-l);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  border-inline-start: 4px solid var(--accent);
}

.upcoming-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.upcoming-item:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.empty-state {
  background: var(--surface);
  border-radius: var(--radius-xl);
  padding: 32px 20px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

.empty-state .icon-wrap {
  width: 64px;
  height: 64px;
  border-radius: 20px;
  background: var(--accent-soft);
  color: var(--accent);
  display: grid;
  place-items: center;
}

.toast-root {
  position: fixed;
  left: 16px;
  right: 16px;
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 12px);
  z-index: 80;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--navy-900);
  color: #fff;
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  animation: rise 200ms ease;
}

.toast.success {
  background: #0b3d32;
}
.toast.danger {
  background: #7f1d1d;
}

.overlay-root {
  position: relative;
  z-index: 60;
}

.overlay-backdrop {
  position: fixed;
  inset: 0;
  background: var(--overlay);
  animation: fade 180ms ease;
}

.modal {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(480px, calc(100% - 32px));
  background: var(--surface);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-lg);
  padding: 20px;
  animation: pop 200ms ease;
  max-height: min(86dvh, 720px);
  overflow: auto;
}

.sheet {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 10px 16px calc(20px + var(--safe-bottom));
  box-shadow: var(--shadow-lg);
  animation: sheet 220ms ease;
  max-height: min(92dvh, 760px);
  overflow: auto;
}

.sheet-handle {
  width: 44px;
  height: 4px;
  border-radius: 4px;
  background: var(--border-strong);
  margin: 6px auto 14px;
}

.quick-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  text-align: right;
  padding: 12px;
  border-radius: 16px;
  min-height: 68px;
}

.quick-item:hover,
.quick-item:focus-visible {
  background: var(--surface-2);
}

.quick-icon {
  width: 48px;
  height: 48px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.score-ring {
  width: 168px;
  height: 168px;
  margin: 0 auto;
}

.progress-bar {
  height: 8px;
  background: var(--bg-elev);
  border-radius: 99px;
  overflow: hidden;
}
.progress-bar > span {
  display: block;
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  border-radius: 14px;
  padding: 0 12px;
  min-height: 48px;
  box-shadow: var(--shadow-sm);
}

.search-box input {
  border: 0;
  background: transparent;
  width: 100%;
  min-height: 44px;
  outline: none;
}

.chart-wrap {
  background: var(--surface);
  border-radius: var(--radius-l);
  padding: 16px 8px 8px;
  box-shadow: var(--shadow-sm);
}

.chart-tooltip {
  position: absolute;
  background: var(--navy-900);
  color: #fff;
  font-size: 12px;
  font-weight: 700;
  padding: 6px 8px;
  border-radius: 8px;
  pointer-events: none;
  white-space: nowrap;
}

.timeline-item {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 12px;
  padding: 12px 0;
}

.timeline-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-top: 6px;
  background: var(--accent);
}

.stars button {
  min-width: 36px;
  min-height: 36px;
  color: var(--text-faint);
}
.stars button.is-on {
  color: #f59e0b;
}

.fab {
  position: fixed;
  left: calc(16px + var(--safe-left));
  bottom: calc(var(--nav-h) + var(--safe-bottom) + 16px);
  z-index: 25;
  min-width: 52px;
  min-height: 52px;
  padding: 0 16px;
  border-radius: 18px;
  background: var(--navy-900);
  color: #fff;
  font-weight: 800;
  box-shadow: var(--shadow-lg);
}

@media (min-width: 1024px) {
  .toast-root {
    left: auto;
    right: calc(var(--sidebar-w) + 24px);
    bottom: 24px;
    width: min(360px, 100%);
  }
  .fab {
    display: none;
  }
  .card:hover,
  .kpi-card:hover,
  .list-card:hover {
    transform: translateY(-1px);
    transition: transform var(--ease), box-shadow var(--ease);
  }
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translate(-50%, -46%) scale(0.98);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }
}
@keyframes sheet {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.field-label {
  font-size: var(--fs-label);
  font-weight: 800;
  color: var(--text);
}

.field-optional {
  color: var(--text-faint);
  font-weight: 600;
}

.field-control {
  display: flex;
  align-items: center;
  min-height: 52px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-m);
  padding: 0 12px;
  gap: 8px;
}

.field-control:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}

.field-control input,
.field-control select,
.field-control textarea {
  border: 0;
  outline: none;
  background: transparent;
  width: 100%;
  min-height: 44px;
}

.field-control textarea {
  min-height: 96px;
  padding: 12px 0;
  resize: vertical;
}

.field-suffix {
  color: var(--text-muted);
  font-weight: 700;
  white-space: nowrap;
}

.field-error {
  color: var(--danger-600);
  font-size: 13px;
  font-weight: 700;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}

.form-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: sticky;
  bottom: calc(8px + var(--safe-bottom));
  padding-top: 8px;
}

.details-toggle {
  min-height: 44px;
  font-weight: 800;
  color: var(--accent);
  text-align: right;
}

.progress-steps {
  display: flex;
  align-items: center;
  gap: 8px;
}

.progress-steps span {
  height: 6px;
  flex: 1;
  border-radius: 99px;
  background: var(--border);
}
.progress-steps span.is-on {
  background: var(--accent);
}

.segmented {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: var(--surface-2);
  padding: 4px;
  border-radius: 14px;
  gap: 4px;
}

.segmented button {
  min-height: 40px;
  border-radius: 10px;
  font-weight: 800;
  font-size: 13px;
  color: var(--text-muted);
}

.segmented button.is-active {
  background: var(--surface);
  color: var(--text);
  box-shadow: var(--shadow-sm);
}

.check-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--surface);
  border-radius: 14px;
  padding: 12px;
  min-height: 56px;
  box-shadow: var(--shadow-sm);
  width: 100%;
  text-align: right;
}

.check-box {
  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 2px solid var(--border-strong);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.check-item.is-done .check-box {
  background: var(--accent);
  border-color: var(--accent);
  color: #06241f;
}

.check-item.is-done .check-label {
  color: var(--text-muted);
  text-decoration: line-through;
}

@media (min-width: 768px) {
  .form-grid.two {
    grid-template-columns: 1fr 1fr;
  }
  .form-actions {
    flex-direction: row-reverse;
    position: static;
  }
  .form-actions .btn {
    min-width: 160px;
  }
}

@media (max-width: 359px) {
  .hero-value {
    font-size: 2rem;
  }
  .kpi-card .value {
    font-size: 1.05rem;
  }
  .app-main {
    padding-inline: 12px;
  }
}

@media (min-width: 768px) {
  .kpi-grid.four {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (min-width: 1024px) {
  .desktop-only {
    display: initial;
  }
}

@media (max-width: 1023px) {
  .desktop-only {
    display: none !important;
  }
}

@media (min-width: 1366px) {
  :root {
    --content-max: 980px;
  }
}

@media (min-width: 1920px) {
  :root {
    --content-max: 1040px;
  }
}

html,
body {
  max-width: 100%;
  overflow-x: hidden;
}

.table-cards {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.more-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.more-tile {
  background: var(--surface);
  border-radius: var(--radius-l);
  padding: 16px 12px;
  min-height: 108px;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
  text-align: right;
}

.more-tile svg {
  color: var(--accent);
}

@media (min-width: 430px) {
  .more-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@page {
  size: A4;
  margin: 14mm;
}

@media print {
  html,
  body {
    background: #fff !important;
    color: #111 !important;
  }

  .sidebar,
  .bottom-nav,
  .topbar,
  .overlay-root,
  .toast-root,
  .fab,
  .skip-link,
  .no-print,
  .form-actions,
  .btn,
  .search-box,
  .chip,
  .bottom-nav-btn {
    display: none !important;
  }

  .app,
  .app-body,
  .app-main {
    display: block;
    width: 100%;
    max-width: none;
    padding: 0;
    margin: 0;
    background: #fff;
  }

  .card,
  .hero-card,
  .kpi-card,
  .chart-wrap,
  .list-card {
    box-shadow: none !important;
    break-inside: avoid;
    border: 1px solid #e5e7eb;
  }

  .print-header {
    display: flex !important;
    justify-content: space-between;
    margin-bottom: 16px;
    border-bottom: 2px solid #0a2540;
    padding-bottom: 12px;
  }

  .print-only {
    display: block !important;
  }

  a[href]::after {
    content: none !important;
  }
}

.print-only {
  display: none;
}

.print-header {
  display: none;
}
